name: Checks

# Tests (including the privacy check) and a test build on every change. Publishing is done by Vercel, which builds
# the app itself from the main branch.
on:
  push:
    branches: [main]
    paths-ignore: ['.github/heartbeat.txt', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # The private words the privacy check looks for (a repository secret, never in the code).
          PRIVACY_WORDS: ${{ secrets.PRIVACY_WORDS }}
      - run: npm run build
