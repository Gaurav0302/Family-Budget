name: Keep the database awake

# Free Supabase projects pause after a week without use. This calls a harmless "ping"
# function twice a week, then records the time so GitHub keeps running scheduled jobs.
on:
  schedule:
    - cron: '17 20 * * 0,3'   # Monday and Thursday mornings, Melbourne time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://bcmfghlfzywwzkezhmde.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_eNnfeHtkr0J-_jYzkMjVyQ_JBkNiKSd" \
            -H "Content-Type: application/json" -d '{}'
      - name: Record heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          git config user.name "keep-awake bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit -m "Heartbeat" || exit 0
          git push
